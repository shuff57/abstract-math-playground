<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Graphing Playground</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b5fb8'/%3E%3Cpath d='M5 25h22M7 5v22' stroke='%23fff' stroke-opacity='.55' stroke-width='1.5' fill='none'/%3E%3Cpath d='M7 24C13 24 13 8 19 8s6 12 8 16' stroke='%23ffd166' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong palette.
      (function () {
        var t = null;
        try { t = localStorage.getItem("gp-theme"); } catch (e) {}
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#canvas">Skip to graph</a>
    <div id="app">
      <header class="topbar">
        <button id="drawer-btn" class="icon-btn only-tablet" type="button" aria-label="Show expressions" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <h1 class="title">Graphing Playground</h1>
        <span class="spacer"></span>
        <button id="share-btn" class="btn" type="button" aria-label="Copy share link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1" /></svg>
          <span class="lbl">Copy share link</span>
        </button>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </header>

      <div class="main">
        <aside id="sidebar" class="sidebar" aria-label="Expressions">
          <div id="sheet-handle" class="sheet-handle only-phone" role="button" tabindex="0" aria-expanded="false" aria-label="Expressions panel. Press to change height.">
            <span class="grip"></span>
            <span class="sheet-title">Expressions</span>
          </div>
          <div class="side-head">
            <h2>Expressions</h2>
            <div class="add-wrap">
              <button id="add-btn" class="btn primary" type="button" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg><span>Add</span>
              </button>
              <ul id="add-menu" class="menu" role="menu" hidden>
                <li role="none"><button role="menuitem" type="button" data-kind="equation">Equation</button></li>
                <li role="none"><button role="menuitem" type="button" data-kind="expression">Expression</button></li>
                <li role="none"><button role="menuitem" type="button" data-kind="points">Points</button></li>
                <li role="none"><button role="menuitem" type="button" data-kind="table">Table</button></li>
                <li role="none"><button role="menuitem" type="button" data-kind="expression" data-latex="(-y, x)">Vector field (example)</button></li>
                <li role="none"><button role="menuitem" type="button" data-kind="note">Note</button></li>
              </ul>
            </div>
          </div>
          <ol id="rows" class="rows"></ol>
          <p class="hint">Try <code>y=x^2</code>, <code>x^2+y^2=25</code> or <code>y=k*sin(x)</code>. In 3D: <code>z=sin(x)*cos(y)*3</code>. A tuple like <code>(-y, x)</code> draws a vector field.</p>
          <div id="sidebar-resizer" class="resizer only-desktop" role="separator" aria-orientation="vertical" aria-label="Resize expression list" tabindex="0"></div>
        </aside>
        <div id="scrim" class="scrim" hidden></div>

        <section id="stage" class="stage" aria-label="Graph">
          <canvas id="canvas" tabindex="0" role="img" aria-label="Graph canvas"></canvas>
          <div id="labels" class="labels" aria-hidden="true"></div>
          <div class="floating">
            <div class="seg" role="group" aria-label="Dimension">
              <button type="button" data-mode="1d" aria-pressed="false">1D</button>
              <button type="button" data-mode="2d" aria-pressed="true">2D</button>
              <button type="button" data-mode="3d" aria-pressed="false">3D</button>
            </div>
            <div id="slice-tools" class="slice-tools">
              <button id="slice-toggle" class="btn" type="button" aria-pressed="false" aria-controls="slice-panel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5zM3 15l9 5 9-5" /></svg><span>Slice</span>
              </button>
              <p id="slice-reason" class="slice-reason" hidden>Slices need a 2D or 3D graph.</p>
              <div id="slice-panel" class="slice-panel" role="group" aria-label="Slice settings" hidden>
                <div id="slice-axes" class="seg" role="group" aria-label="Fixed axis">
                  <button type="button" data-axis="x" aria-pressed="false">x</button>
                  <button type="button" data-axis="y" aria-pressed="false">y</button>
                  <button type="button" data-axis="z" aria-pressed="false">z</button>
                </div>
                <label class="slice-val"><span id="slice-eq">y =</span>
                  <input id="slice-value" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="0" />
                </label>
                <input id="slice-range" type="range" min="-10" max="10" step="0.05" value="0" />
                <p id="slice-status" class="slice-status" aria-live="off"></p>
              </div>
            </div>
            <div id="three-tools" class="three-tools" hidden>
              <div class="seg" role="group" aria-label="Projection">
                <button type="button" data-ortho="false" aria-pressed="true" title="Perspective">Persp</button>
                <button type="button" data-ortho="true" aria-pressed="false" title="Orthographic">Ortho</button>
              </div>
              <button id="reset-btn" class="btn" type="button" title="Reset view (R)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5" /></svg><span>Reset</span>
              </button>
            </div>
          </div>
          <div id="slice-frame" class="slice-frame" role="group" aria-label="Slice inset" hidden>
            <span id="slice-title" class="slice-title"></span>
            <button id="slice-close" class="slice-close" type="button" aria-label="Close slice">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <div id="ticker-bar" class="ticker-bar" role="group" aria-label="Ticker" hidden>
            <button id="ticker-toggle" class="btn" type="button" aria-pressed="false" aria-label="Start ticker (Space)" title="Start or stop the ticker (Space)">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor" /></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3" /></svg>
              <span class="lbl" id="ticker-lbl">Play</span>
            </button>
            <label class="ticker-rate" for="ticker-rate">Every <input id="ticker-rate" type="number" min="1" step="10" value="50" inputmode="numeric" /> ms</label>
            <span id="ticker-hint" class="ticker-hint">Space starts or stops. Edit a value to reset it.</span>
          </div>
          <div id="fail" class="fail" role="alert" hidden></div>
        </section>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
