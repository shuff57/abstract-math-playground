[package]
name = "math_core"
version = "0.1.0"
edition = "2021"
description = "Pure-logic math engine: parser, AST, evaluators and analysis. No GPU or windowing dependencies."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.7"
base64 = "0.22"

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
